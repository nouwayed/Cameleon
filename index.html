<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Mission Caméléon</title>
  <meta name="description" content="Le jeu de société où le téléphone donne les ordres… et où l'on joue pour de vrai !" />
  <meta name="theme-color" content="#10b981" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Caméléon" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="fonts/baloo2.css" />
  <link rel="stylesheet" href="tailwind.css" />
  <style>
    html, body { height: 100%; }
    body {
      font-family: "Baloo 2", system-ui, sans-serif;
      background: radial-gradient(circle at 20% 0%, #d1fae5 0%, transparent 45%),
                  radial-gradient(circle at 100% 100%, #fef3c7 0%, transparent 50%),
                  #f0fdf4;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    .screen { animation: screenIn .45s cubic-bezier(.2,.9,.3,1.2) both; }
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    .pop { animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
    @keyframes pop {
      0% { transform: scale(.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .wiggle { animation: wiggle 2.4s ease-in-out infinite; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }
    .pulse-ring { animation: pulseRing 1.2s ease-out infinite; }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, .55); }
      100% { box-shadow: 0 0 0 28px rgba(239, 68, 68, 0); }
    }
    .btn-giant {
      transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
      box-shadow: 0 8px 0 rgba(0,0,0,.18);
    }
    .btn-giant:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
    .btn-giant:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .confetti {
      position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; opacity: .9;
      animation-name: confettiFall; animation-timing-function: linear; animation-iteration-count: infinite;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(540deg); }
    }
    @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
    .badge-in { animation: pop .35s cubic-bezier(.2,1.6,.4,1) both; }
    .ring-track { stroke: rgba(255,255,255,.25); }
    .ring-progress { transition: stroke-dashoffset 1s linear, stroke .3s ease; }
    .safe-pad {
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="text-slate-800 antialiased">
  <main id="app" class="safe-pad mx-auto flex min-h-full max-w-md flex-col px-4"></main>
  <script src="app.js"></script>
</body>
</html>
